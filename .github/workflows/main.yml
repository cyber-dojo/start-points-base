name: Main

on:
  push:

jobs:
  setup:
    runs-on: ubuntu-latest
    needs: []
    outputs:
      image_sha:   ${{ steps.vars.outputs.image_sha }}
      image_tag:   ${{ steps.vars.outputs.image_tag }}
      image_name:  ${{ steps.vars.outputs.image_name }}
      candidate_image_name: ${{ steps.vars.outputs.candidate_image_name }}
      branch_name: ${{ steps.vars.outputs.branch_name }}
    steps:
      - name: Prepare outputs for workflow jobs
        id: vars
        run: |
          TAG="${GITHUB_SHA:0:7}"
          {
            echo "image_sha=${GITHUB_SHA}"
            echo "image_tag=${TAG}"
            echo "image_name=cyberdojo/start-points-base:${TAG}"
            echo "candidate_image_name=cyberdojo/start-points-base:${TAG}-candidate"
            echo "branch_name=update-base-image-${TAG}"
          } >> ${GITHUB_OUTPUT}
  

  # Builds both platforms once and pushes them under a candidate tag. The test
  # and scan jobs pull that candidate, and push-image retags it, so the image
  # released is byte-for-byte the one tested. A multi-platform image cannot
  # be passed between jobs as a docker-save tar.
  build-image:
    runs-on: ubuntu-latest
    needs: [setup]
    env:
      CANDIDATE_IMAGE_NAME: ${{ needs.setup.outputs.candidate_image_name }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: cyber-dojo/pinned-checkout@main

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # The runner is amd64, so the arm64 build runs under QEMU emulation.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and push candidate image
        run:
          docker buildx build
            --platform linux/amd64,linux/arm64
            --build-arg SHA="${GITHUB_SHA}"
            --tag "${CANDIDATE_IMAGE_NAME}"
            --push
            .


  test-image:
    runs-on: ubuntu-latest
    needs: [setup, build-image]
    env:
      IMAGE_NAME: ${{ needs.setup.outputs.image_name }}
      CANDIDATE_IMAGE_NAME: ${{ needs.setup.outputs.candidate_image_name }}
    steps:
      # The tests look for the image under IMAGE_NAME, and run amd64.
      - name: Pull candidate image
        run: |
          docker pull --platform linux/amd64 "${CANDIDATE_IMAGE_NAME}"
          docker tag "${CANDIDATE_IMAGE_NAME}" "${IMAGE_NAME}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Test image
        run:
          make test_image


  snyk-container-scan:
    needs: [setup, build-image]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ needs.setup.outputs.image_name }}
      CANDIDATE_IMAGE_NAME: ${{ needs.setup.outputs.candidate_image_name }}
    steps:
      - name: Pull candidate image
        run: |
          docker pull --platform linux/amd64 "${CANDIDATE_IMAGE_NAME}"
          docker tag "${CANDIDATE_IMAGE_NAME}" "${IMAGE_NAME}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Snyk
        uses: snyk/actions/setup@master
        with:
          snyk-version: v1.1300.2

      - name: Run Snyk container scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run:
          snyk container test ${IMAGE_NAME}
            --policy-path=.snyk
            --sarif
            --sarif-file-output=snyk.container.scan.json


  push-image:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [setup, test-image, snyk-container-scan]
    env:
      IMAGE_NAME: ${{ needs.setup.outputs.image_name }}
      CANDIDATE_IMAGE_NAME: ${{ needs.setup.outputs.candidate_image_name }}
    outputs:
      digest: ${{ steps.variables.outputs.digest }}
    steps:
      - uses: cyber-dojo/setup-kosli-cli@main

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - uses: docker/setup-buildx-action@v4

      # A registry-side retag: the index and every manifest are copied as they
      # are, so the released image keeps the digest of the tested candidate.
      - name: Release the tested candidate on DockerHub
        run:
          docker buildx imagetools create
            --tag "${IMAGE_NAME}"
            "${CANDIDATE_IMAGE_NAME}"

      - name: Make image digest available to following jobs
        id: variables
        run: |
          DIGEST=$(kosli fingerprint "${IMAGE_NAME}" --artifact-type=oci)        
          echo "digest=${DIGEST}" >> ${GITHUB_OUTPUT}      


  create-pr-on-downstream-repos:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [setup, push-image]
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ needs.setup.outputs.branch_name }}
    strategy:
      matrix:
        repo:
          - custom-start-points
          - exercises-start-points
          - languages-start-points
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cyber-dojo/${{ matrix.repo }}
          token: ${{ secrets.BASE_IMAGE_UPGRADE }}
          fetch-depth: 0

      - name: Create branch
        run:
          git checkout -b ${BRANCH_NAME}

      - name: Create new Basefile.env
        env:
          IMAGE:  cyberdojo/start-points-base
          SHA:    ${{ needs.setup.outputs.image_sha }}
          TAG:    ${{ needs.setup.outputs.image_tag }}
          DIGEST: ${{ needs.push-image.outputs.digest }}
        run: |
          filename=Basefile.env
          prefix=CYBER_DOJO_START_POINTS_BASE
          echo "${prefix}_IMAGE=${IMAGE}"    > ${filename}
          echo "${prefix}_SHA=${SHA}"       >> ${filename}
          echo "${prefix}_TAG=${TAG}"       >> ${filename}
          echo "${prefix}_DIGEST=${DIGEST}" >> ${filename}

      - name: Commit
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.event.sender.login }}@users.noreply.github.com"
          git add .
          git commit --message "Dockerfile - Automated base-image update"
          git push --set-upstream origin ${BRANCH_NAME}

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.BASE_IMAGE_UPGRADE }}
        run:
          gh pr create
            --base main
            --head ${BRANCH_NAME}
            --title 'Merge update-base-image into main'
            --body 'Created by Github action'

